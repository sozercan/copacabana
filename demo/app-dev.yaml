apiVersion: v1
kind: Namespace
metadata:
  name: shop-dev
  labels:
    copa.sh/patching: enabled     # opt this namespace in
    copa.sh/approval: automatic   # roll patches out without asking
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop-dev
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app: web
        copa.sh/rollout: enabled  # patch this app's pods
    spec:
      containers:
      - name: web
        image: kind-registry:5000/library/nginx:1.25.3-alpine
        readinessProbe:
          httpGet: {path: /, port: 80}
