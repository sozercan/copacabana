apiVersion: apps/v1
kind: Deployment
metadata:
  name: copa-rollout-controller
  namespace: copa-system
  labels: {app: copa-rollout-controller}
spec:
  replicas: 1
  selector:
    matchLabels: {app: copa-rollout-controller}
  template:
    metadata:
      labels: {app: copa-rollout-controller}
    spec:
      serviceAccountName: copa-rollout-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: controller
        image: CONTROLLER_IMAGE
        args:
        - --mode=MODE
        - --platforms=linux/amd64
        - --insecure-registries=kind-registry:5000
        - --patched-prefix=kind-registry:5000/patched
        - --staging-prefix=kind-registry:5000/staging
        - --worker-image=WORKER_IMAGE
        - --buildkit-image=moby/buildkit:v0.33.0-rootless
        - --trivy-server=http://trivy-server.copa-builder:4954
        - --attestation-public-key=/keys/signing.pub
        # Short timings for the demo. Production would use hours, not minutes.
        - --resolve-interval=30s
        - --rescan-interval=1h
        - --rollout-deadline=5m
        - --healthy-for=30s
        - --soak=2m
        - --max-concurrent-restarts=2
        ports:
        - {name: metrics, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /readyz, port: 8081}
        livenessProbe:
          httpGet: {path: /healthz, port: 8081}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        volumeMounts:
        - {name: pubkey, mountPath: /keys, readOnly: true}
      volumes:
      - name: pubkey
        secret: {secretName: copa-attestation-pubkey}
