apiVersion: v1
kind: Namespace
metadata:
  name: copa-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
# Scan and build Jobs run here. Rootless BuildKit needs unconfined seccomp and AppArmor,
# which only the privileged Pod Security level allows. Nothing else should run in this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: copa-builder
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
---
# Verify Jobs run here. They hold the signing key and never run image content.
apiVersion: v1
kind: Namespace
metadata:
  name: copa-verifier
  labels:
    pod-security.kubernetes.io/enforce: restricted
