---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: sourceimages.rollout.copa.sh
spec:
  group: rollout.copa.sh
  names:
    kind: SourceImage
    listKind: SourceImageList
    plural: sourceimages
    shortNames:
    - srcimg
    singular: sourceimage
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository
      name: Repository
      type: string
    - jsonPath: .status.references[0]
      name: Reference
      priority: 1
      type: string
    - jsonPath: .status.fixable
      name: Fixable
      type: integer
    - jsonPath: .status.current.tag
      name: Patch
      type: string
    - jsonPath: .status.usedByCount
      name: Users
      priority: 1
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SourceImage is one source digest in use by opted-in workloads.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SourceImageSpec identifies one source digest that opted-in
              workloads use.
            properties:
              digest:
                description: Digest of the source index or manifest.
                type: string
              platforms:
                description: |-
                  Platforms of the source that the cluster runs, with their manifest digests. Empty when the source has
                  none of the cluster's platforms; the SourceImage then records a gap instead of building.
                items:
                  description: PlatformDigest pairs a platform with an image manifest
                    digest.
                  properties:
                    digest:
                      description: Digest of the platform-specific image manifest.
                      type: string
                    platform:
                      description: Platform such as linux/amd64.
                      type: string
                  required:
                  - digest
                  - platform
                  type: object
                type: array
              repository:
                description: Repository is the canonical repository, such as index.docker.io/library/nginx.
                type: string
            required:
            - digest
            - repository
            type: object
          status:
            description: SourceImageStatus records who uses the source and what patch
              exists for it.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              current:
                description: Current is the latest verified patch for this source.
                properties:
                  digest:
                    description: Digest of the patched index.
                    type: string
                  platforms:
                    description: Platforms that were patched. Every platform in the
                      index was patched.
                    items:
                      description: PlatformPatch records what one platform of a patch
                        was built from.
                      properties:
                        patchedDigest:
                          type: string
                        platform:
                          type: string
                        remainingFixable:
                          description: RemainingFixable is how many fixable vulnerabilities
                            the post-patch scan still found.
                          type: integer
                        sourceDigest:
                          type: string
                      required:
                      - patchedDigest
                      - platform
                      - sourceDigest
                      type: object
                    type: array
                  ref:
                    description: Ref is the pinned reference, repo@digest. Admission
                      applies this.
                    type: string
                  revision:
                    description: Revision number of this patch for its source tag.
                    type: integer
                  tag:
                    description: Tag is the readable tag, such as 1.25.3-alpine-2.
                    type: string
                required:
                - digest
                - ref
                type: object
              fixable:
                description: Fixable is the number of fixable OS vulnerabilities in
                  the latest scan of the source or current patch.
                type: integer
              floatingReferences:
                description: FloatingReferences resolve to this digest but use tags
                  upstream moves, such as latest or 1.25. They aren't swapped.
                items:
                  type: string
                type: array
              gap:
                description: Gap explains why this source can't be patched, if it
                  can't.
                type: string
              lastResolved:
                description: LastResolved is when the controller last saw a template
                  resolve to this digest.
                format: date-time
                type: string
              references:
                description: References are the canonical tag or digest references
                  that resolve to this digest.
                items:
                  type: string
                type: array
              usedBy:
                description: UsedBy lists opted-in workloads whose templates ask for
                  this source.
                items:
                  description: WorkloadRef points at a workload that uses a source
                    image.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    reference:
                      description: Reference is the image string as the template writes
                        it.
                      type: string
                  required:
                  - name
                  - namespace
                  - reference
                  type: object
                type: array
              usedByCount:
                description: UsedByCount is len(UsedBy), for printing.
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
