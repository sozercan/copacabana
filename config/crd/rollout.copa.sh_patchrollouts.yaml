---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: patchrollouts.rollout.copa.sh
spec:
  group: rollout.copa.sh
  names:
    kind: PatchRollout
    listKind: PatchRolloutList
    plural: patchrollouts
    shortNames:
    - prollout
    singular: patchrollout
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .spec.candidate.tag
      name: Candidate
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.message
      name: Message
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PatchRollout rolls one candidate patch out to one rollout group
          (namespace).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PatchRolloutSpec is the candidate for one source in one rollout
              group. Only the controller writes it.
            properties:
              candidate:
                description: Candidate is the patch to roll out.
                properties:
                  digest:
                    description: Digest of the patched index.
                    type: string
                  platforms:
                    description: Platforms that were patched. Every platform in the
                      index was patched.
                    items:
                      description: PlatformPatch records what one platform of a patch
                        was built from.
                      properties:
                        patchedDigest:
                          type: string
                        platform:
                          type: string
                        remainingFixable:
                          description: RemainingFixable is how many fixable vulnerabilities
                            the post-patch scan still found.
                          type: integer
                        sourceDigest:
                          type: string
                      required:
                      - patchedDigest
                      - platform
                      - sourceDigest
                      type: object
                    type: array
                  ref:
                    description: Ref is the pinned reference, repo@digest. Admission
                      applies this.
                    type: string
                  revision:
                    description: Revision number of this patch for its source tag.
                    type: integer
                  tag:
                    description: Tag is the readable tag, such as 1.25.3-alpine-2.
                    type: string
                required:
                - digest
                - ref
                type: object
              source:
                description: Source is the canonical source reference.
                type: string
              sourceDigest:
                description: SourceDigest the candidate was built from.
                type: string
              sourceImage:
                description: SourceImage is the name of the SourceImage the candidate
                  was built from.
                type: string
            required:
            - candidate
            - source
            - sourceDigest
            - sourceImage
            type: object
          status:
            description: PatchRolloutStatus is the observed state of a PatchRollout.
            properties:
              approvedBy:
                description: ApprovedBy is the PatchApproval or policy that approved
                  the candidate.
                type: string
              message:
                type: string
              phase:
                description: RolloutPhase is the phase of a PatchRollout.
                type: string
              phaseSince:
                description: PhaseSince is when the current phase started.
                format: date-time
                type: string
              restored:
                description: 'Restored is what recovery put back: a patch ref or the
                  fallback.'
                type: string
              workloads:
                items:
                  description: RolloutWorkload tracks one Deployment in a rollout.
                  properties:
                    generation:
                      description: Generation is the Deployment generation after the
                        controller's restart. A higher generation means a team deployed.
                      format: int64
                      type: integer
                    message:
                      type: string
                    name:
                      type: string
                    phase:
                      description: WorkloadPhase is the phase of one workload inside
                        a rollout.
                      type: string
                    readySince:
                      description: ReadySince is when every new pod was ready and
                        running the expected image.
                      format: date-time
                      type: string
                    restartBaseline:
                      description: RestartBaseline is the total container restart
                        count when the pods became ready.
                      format: int32
                      type: integer
                    restartedAt:
                      description: RestartedAt is the value the controller set on
                        the restart annotation.
                      type: string
                    uid:
                      type: string
                  required:
                  - name
                  - phase
                  - uid
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
